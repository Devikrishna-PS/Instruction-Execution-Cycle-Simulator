<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-Cycle RISC Simulator | Splash</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/splash.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <!-- Auto Redirect after 3 seconds -->
    <script>
        setTimeout(function() {
            window.location.href = "{{ url_for('landing') }}";
        }, 3000);
    </script>
</head>
<body>
    <!-- Background Glow Effects -->
    <div class="glow-orb glow-left"></div>
    <div class="glow-orb glow-right"></div>

    <!-- Splash Content -->
    <div class="splash-container">
        <h1 class="splash-title">⚙️ RISC Simulator</h1>

        <div class="loader"></div>

        <p class="loading-text">Initializing...</p>
        
        <!-- Loading Steps -->
        <div class="loading-steps">
            <div class="loading-step active" data-step="1">
                <span class="step-icon">✓</span>
                <span class="step-text">Loading Registers</span>
            </div>
            <div class="loading-step" data-step="2">
                <span class="step-icon">✓</span>
                <span class="step-text">Initializing Pipeline</span>
            </div>
            <div class="loading-step" data-step="3">
                <span class="step-icon">✓</span>
                <span class="step-text">Starting Simulator</span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/splash.js') }}"></script>
</body>
</html>
